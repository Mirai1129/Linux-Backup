setw -g mode-keys vi
set -g mouse off

# reduce delay when pressing ESC in vim
set -sg escape-time 10

# Start Window numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Style
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 100
set -g status-left "#[fg=#cba6f7,bold] #(whoami) #[fg=#cdd6f4,nobold]on #[fg=#a6e3a1,bold]#S  "

set -g status-justify centre
setw -g window-status-separator "#[fg=#45475a] | "
setw -g window-status-format "#[fg=#6c7086] #I "
setw -g window-status-current-format "#[bg=#fab387,fg=#181825,bold] #I: #W "

set -g status-right-length 100
set -g status-right "#[fg=#b4befe]📅 %Y-%m-%d #[fg=#cdd6f4]🕒 %H:%M "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Keep this line at the bottom
run '~/.tmux/plugins/tpm/tpm'
